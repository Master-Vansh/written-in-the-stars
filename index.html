<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Written in the Stars</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME -->

    <main id="homeScreen" class="home-screen">

        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>

        <div class="home-content">

            <div class="star">✦</div>

            <div class="eyebrow">
                A STORY OF LEO & NOVA
            </div>

            <h1>
                Written
                <span>in the Stars</span>
            </h1>

            <p>
                Two hearts, a little chaos, and a story written in the stars.
            </p>

            <button id="openStoryBtn">
                <span>OPEN THE STORY</span>
                <b>→</b>
            </button>

        </div>

        <div class="home-footer">
            LEO × NOVA
        </div>

    </main>


    <!-- READER -->

    <main id="readerScreen" class="reader-screen hidden">

        <header class="reader-header">

            <button
                id="backHomeBtn"
                class="header-button"
            >
                ←
            </button>

            <div class="reader-title">

                <span>
                    WRITTEN IN THE STARS
                </span>

                <small id="headerChapter">
                    CHAPTER I
                </small>

            </div>

            <button
                id="menuBtn"
                class="header-button"
            >
                ☰
            </button>

        </header>


        <!-- CHAPTER TITLE -->

        <section class="chapter-info">

            <span id="chapterNumber">
                CHAPTER I
            </span>

            <h2 id="chapterTitle">
                Where It All Began
            </h2>

        </section>


        <!-- COMIC -->

        <section class="comic-area">

            <button
                id="previousPageBtn"
                class="side-arrow left"
            >
                ‹
            </button>

            <div class="comic-frame">

                <div
                    id="imageLoading"
                    class="image-loading"
                >
                    <div></div>
                </div>

                <img
                    id="comicImage"
                    src=""
                    alt="Comic page"
                >

            </div>

            <button
                id="nextPageBtn"
                class="side-arrow right"
            >
                ›
            </button>

        </section>


        <!-- CONTROLS -->

        <div class="reader-controls">

            <div class="progress">

                <span id="pageNumber">
                    01
                </span>

                <div class="progress-line">
                    <div id="progressBar"></div>
                </div>

                <span id="pageTotal">
                    03
                </span>

            </div>

            <div
                id="chapterDots"
                class="chapter-dots"
            ></div>

        </div>


        <!-- CHAPTER MENU -->

        <div
            id="chapterMenu"
            class="chapter-menu hidden"
        >

            <div class="menu-box">

                <button
                    id="closeMenuBtn"
                    class="close-menu"
                >
                    ×
                </button>

                <p>
                    THE STORY
                </p>

                <h3>
                    Chapters
                </h3>

                <div id="chapterList"></div>

            </div>

        </div>


        <!-- CHAPTER END -->

        <div
            id="chapterEnd"
            class="chapter-end hidden"
        >

            <div class="end-content">

                <span>✦</span>

                <p>
                    END OF CHAPTER
                </p>

                <h2 id="nextChapterTitle">
                    Chapter II
                </h2>

                <button id="continueBtn">
                    CONTINUE →
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
